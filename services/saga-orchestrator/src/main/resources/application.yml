spring:
  application:
    name: saga-orchestrator

  datasource:
    url: jdbc:postgresql://localhost:5432/partner_channel?currentSchema=saga_schema
    username: pcm
    password: pcm
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.default_schema: saga_schema
      hibernate.jdbc.time_zone: Asia/Seoul

  jackson:
    time-zone: Asia/Seoul

  flyway:
    enabled: true
    schemas: saga_schema
    default-schema: saga_schema
    create-schemas: true
    locations: classpath:db/migration/saga

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: saga-orchestrator
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

server:
  port: 8085

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
