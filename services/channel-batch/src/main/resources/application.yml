spring:
  application:
    name: channel-batch

  datasource:
    url: jdbc:postgresql://localhost:5432/partner_channel?currentSchema=channel_schema
    username: pcm
    password: pcm
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.default_schema: channel_schema
      hibernate.jdbc.time_zone: Asia/Seoul

  jackson:
    time-zone: Asia/Seoul

  flyway:
    enabled: true
    schemas: channel_schema
    default-schema: channel_schema
    create-schemas: true
    locations: classpath:db/migration/channel

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
