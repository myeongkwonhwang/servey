dependencies {
    // Spring Boot
    implementation 'org.springframework.boot:spring-boot-starter'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

    // Kafka (consumer 중심)
    implementation 'org.springframework.kafka:spring-kafka'

    // DB + Migration
    runtimeOnly 'org.postgresql:postgresql'
    implementation 'org.flywaydb:flyway-core'
    runtimeOnly 'org.flywaydb:flyway-database-postgresql'

    // Internal libs
    implementation project(':libs:channel-event-schema')
    implementation project(':libs:common-domain')
    implementation project(':libs:kafka-infra')
    implementation project(':libs:logistics-gateway')   // 자사 물류 시스템 DB-to-DB Gateway (step 3)
    implementation project(':libs:persistence-common')
}
