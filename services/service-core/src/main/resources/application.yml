spring:
  application:
    name: service-core

  datasource:
    url: jdbc:postgresql://localhost:5432/partner_channel?currentSchema=core_schema
    username: pcm
    password: pcm
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.default_schema: core_schema

  flyway:
    enabled: true
    schemas: core_schema
    default-schema: core_schema
    create-schemas: true
    locations: classpath:db/migration/core

  jackson:
    time-zone: Asia/Seoul   # LocalDateTime 외 Date / Instant 출력에 영향 (학습 단계 보존)

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: service-core
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

server:
  port: 8083

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
